<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <rect width="192" height="192" rx="42" fill="#0f172a"/>
  
  <!-- Subtle inner background glow -->
  <circle cx="96" cy="96" r="70" fill="#0284c7" opacity="0.15"/>
  
  <!-- Main Glossy Capsule Pill (Rotated 45 degrees) -->
  <g transform="translate(96,96) rotate(-45) translate(-96,-96)">
    <!-- Pill Left Half (Cyan) -->
    <path d="M 52,96 A 26,26 0 0,1 78,70 L 96,70 L 96,122 L 78,122 A 26,26 0 0,1 52,96 Z" fill="#0284c7" />
    
    <!-- Pill Right Half (Emerald Green) -->
    <path d="M 96,70 L 114,70 A 26,26 0 0,1 140,96 A 26,26 0 0,1 114,122 L 96,122 Z" fill="#10b981" />
    
    <!-- Pill Center Highlight / Separator -->
    <line x1="96" y1="70" x2="96" y2="122" stroke="#ffffff" stroke-width="2.5" opacity="0.6"/>
    
    <!-- Glossy Top Shine Reflection -->
    <path d="M 64,78 Q 96,74 128,78 Q 96,82 64,78 Z" fill="#ffffff" opacity="0.45" />
  </g>
</svg>
