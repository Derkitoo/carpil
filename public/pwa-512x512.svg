<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="112" fill="#0f172a"/>
  
  <!-- Subtle inner background glow -->
  <circle cx="256" cy="256" r="180" fill="#0284c7" opacity="0.18"/>
  
  <!-- Main Glossy Capsule Pill (Rotated 45 degrees) -->
  <g transform="translate(256,256) rotate(-45) translate(-256,-256)">
    <!-- Pill Left Half (Cyan) -->
    <path d="M 138,256 A 70,70 0 0,1 208,186 L 256,186 L 256,326 L 208,326 A 70,70 0 0,1 138,256 Z" fill="#0284c7" />
    
    <!-- Pill Right Half (Emerald Green) -->
    <path d="M 256,186 L 304,186 A 70,70 0 0,1 374,256 A 70,70 0 0,1 304,326 L 256,326 Z" fill="#10b981" />
    
    <!-- Pill Center Highlight / Separator -->
    <line x1="256" y1="186" x2="256" y2="326" stroke="#ffffff" stroke-width="6" opacity="0.65"/>
    
    <!-- Glossy Top Shine Reflection -->
    <path d="M 170,206 Q 256,196 342,206 Q 256,218 170,206 Z" fill="#ffffff" opacity="0.45" />
  </g>
</svg>
