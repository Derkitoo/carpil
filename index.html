  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then((reg) => {
            console.log('CarePill ServiceWorker registered successfully:', reg.scope);
          }).catch((err) => {
            console.log('CarePill ServiceWorker registration failed:', err);
          });
        });
      }
    </script>
  </body>
